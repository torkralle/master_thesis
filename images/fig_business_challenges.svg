<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <defs>
    <marker id="arrow2" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 15 6, 0 12" fill="#333333"/>
    </marker>
    <marker id="arrow3" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 15 6, 0 12" fill="#000000"/>
    </marker>
  </defs>
  
  <rect width="900" height="550" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">介護事業者が直面する課題の構造</text>
  
  <g transform="translate(0, 80)">
    <rect x="80" y="0" width="220" height="110" fill="#e8e8e8" stroke="#333333" stroke-width="3" rx="8"/>
    <text x="190" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">応募者不足</text>
    <text x="190" y="65" text-anchor="middle" font-size="28" font-weight="bold" fill="#000000">約60%</text>
    <text x="190" y="90" text-anchor="middle" font-size="14" fill="#333333">の事業所が</text>
    <text x="190" y="107" text-anchor="middle" font-size="14" fill="#333333">「採用困難」</text>
    
    <rect x="340" y="0" width="220" height="110" fill="#d8d8d8" stroke="#333333" stroke-width="3" rx="8"/>
    <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">高い採用コスト</text>
    <text x="450" y="65" text-anchor="middle" font-size="26" font-weight="bold" fill="#000000">30〜50万円</text>
    <text x="450" y="90" text-anchor="middle" font-size="15" fill="#333333">/人あたり</text>
    <text x="450" y="107" text-anchor="middle" font-size="13" fill="#666666">(中小事業者に重い負担)</text>
    
    <rect x="600" y="0" width="220" height="110" fill="#c8c8c8" stroke="#333333" stroke-width="3" rx="8"/>
    <text x="710" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">早期離職</text>
    <text x="710" y="65" text-anchor="middle" font-size="28" font-weight="bold" fill="#000000">3〜4割</text>
    <text x="710" y="90" text-anchor="middle" font-size="14" fill="#333333">1年以内に離職</text>
    <text x="710" y="107" text-anchor="middle" font-size="13" fill="#666666">(離職率約15%)</text>
  </g>
  
  <line x1="190" y1="210" x2="370" y2="265" stroke="#333333" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="450" y1="210" x2="450" y2="265" stroke="#333333" stroke-width="3" marker-end="url(#arrow2)"/>
  <line x1="710" y1="210" x2="530" y2="265" stroke="#333333" stroke-width="3" marker-end="url(#arrow2)"/>
  
  <rect x="150" y="280" width="600" height="80" fill="#f0f0f0" stroke="#666666" stroke-width="3" rx="8"/>
  <text x="450" y="310" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">深刻な影響</text>
  <text x="450" y="340" text-anchor="middle" font-size="16" fill="#333333">サービスの質低下 • 経営圧迫 • 廃業リスク増大</text>
  
  <line x1="450" y1="370" x2="450" y2="415" stroke="#000000" stroke-width="4" marker-end="url(#arrow3)"/>
  
  <rect x="120" y="420" width="660" height="90" fill="#e0e0e0" stroke="#333333" stroke-width="4" rx="10"/>
  <rect x="120" y="420" width="660" height="90" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="8,4" rx="10"/>
  <text x="450" y="450" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">根本原因: マッチング精度の低さ</text>
  <text x="450" y="478" text-anchor="middle" font-size="16" fill="#333333">ワーカーの希望・スキル・経験と</text>
  <text x="450" y="500" text-anchor="middle" font-size="16" fill="#333333">求人内容の適切なマッチングが実現できていない</text>
</svg>
