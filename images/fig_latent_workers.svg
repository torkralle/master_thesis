<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#ffffff"/>
  <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">介護福祉士資格保有者の内訳</text>
  
  <g transform="translate(250, 230)">
    <path d="M 0,-150 A 150,150 0 0,1 0,150 L 0,0 Z" fill="#666666" stroke="#333333" stroke-width="3"/>
    <path d="M 0,-150 A 150,150 0 1,1 0,150 L 0,0 Z" fill="#cccccc" stroke="#333333" stroke-width="3"/>
    
    <text x="-70" y="-20" text-anchor="middle" font-size="28" font-weight="bold" fill="#ffffff">27万人</text>
    <text x="-70" y="10" text-anchor="middle" font-size="18" fill="#ffffff">(57%)</text>
    <text x="-70" y="35" text-anchor="middle" font-size="14" fill="#ffffff">福祉・介護分野</text>
    <text x="-70" y="52" text-anchor="middle" font-size="14" fill="#ffffff">で従事中</text>
    
    <text x="70" y="-20" text-anchor="middle" font-size="28" font-weight="bold" fill="#000000">20万人</text>
    <text x="70" y="10" text-anchor="middle" font-size="18" fill="#000000">(43%)</text>
    <text x="70" y="35" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">潜在介護福祉士</text>
    <text x="70" y="52" text-anchor="middle" font-size="13" fill="#000000">(未活用)</text>
  </g>
  
  <rect x="150" y="410" width="500" height="50" fill="#f5f5f5" stroke="#666666" stroke-width="2" rx="6"/>
  <text x="400" y="440" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">介護福祉士資格保有者 総数: 47万人</text>
  
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="25" height="25" fill="#666666" stroke="#333333" stroke-width="1"/>
    <text x="35" y="18" font-size="14" fill="#000000">介護分野で従事 (27万人)</text>
    
    <rect x="0" y="35" width="25" height="25" fill="#cccccc" stroke="#333333" stroke-width="1"/>
    <text x="35" y="53" font-size="14" fill="#000000">潜在介護福祉士 (20万人)</text>
    
    <rect x="0" y="80" width="250" height="60" fill="#f0f0f0" stroke="#666666" stroke-width="2" rx="4"/>
    <text x="125" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000">ポイント</text>
    <text x="125" y="120" text-anchor="middle" font-size="11" fill="#333333">20万人を活用できれば</text>
    <text x="125" y="134" text-anchor="middle" font-size="11" fill="#333333">3年分以上の不足をカバー可能</text>
  </g>
</svg>
