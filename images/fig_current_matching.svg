<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666666"/>
    </marker>
  </defs>
  
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">現行マッチングシステムの定型条件フィルタリング構造</text>
  
  <rect x="50" y="100" width="150" height="80" fill="#f5f5f5" stroke="#333333" stroke-width="2" rx="6"/>
  <text x="125" y="135" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">ワーカー</text>
  <text x="125" y="155" text-anchor="middle" font-size="12" fill="#666666">(求職者)</text>
  
  <rect x="280" y="50" width="130" height="60" fill="#e8e8e8" stroke="#666666" stroke-width="2" rx="4"/>
  <text x="345" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">都道府県</text>
  <text x="345" y="93" text-anchor="middle" font-size="12" fill="#666666">市区町村</text>
  
  <rect x="430" y="50" width="130" height="60" fill="#e8e8e8" stroke="#666666" stroke-width="2" rx="4"/>
  <text x="495" y="75" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">開始日</text>
  <text x="495" y="93" text-anchor="middle" font-size="12" fill="#666666">終了日</text>
  
  <rect x="580" y="50" width="130" height="60" fill="#e8e8e8" stroke="#666666" stroke-width="2" rx="4"/>
  <text x="645" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">資格種別</text>
  
  <rect x="280" y="130" width="130" height="60" fill="#e8e8e8" stroke="#666666" stroke-width="2" rx="4"/>
  <text x="345" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">給与範囲</text>
  
  <rect x="430" y="130" width="130" height="60" fill="#e8e8e8" stroke="#666666" stroke-width="2" rx="4"/>
  <text x="495" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">介護種別</text>
  
  <rect x="720" y="100" width="130" height="80" fill="#d8d8d8" stroke="#333333" stroke-width="2" rx="6"/>
  <text x="785" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">検索結果</text>
  <text x="785" y="150" text-anchor="middle" font-size="12" fill="#666666">リスト</text>
  
  <line x1="200" y1="120" x2="275" y2="80" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="200" y1="130" x2="425" y2="80" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="200" y1="140" x2="575" y2="80" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="200" y1="150" x2="275" y2="160" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="200" y1="160" x2="425" y2="160" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  
  <line x1="410" y1="80" x2="715" y2="120" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="560" y1="80" x2="715" y2="125" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="650" y1="110" x2="715" y2="130" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="410" y1="160" x2="715" y2="150" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="560" y1="160" x2="715" y2="155" stroke="#666666" stroke-width="2" marker-end="url(#arrow5)"/>
  
  <rect x="100" y="270" width="700" height="140" fill="#f0f0f0" stroke="#666666" stroke-width="2" rx="6"/>
  <text x="450" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">問題点</text>
  <text x="450" y="325" text-anchor="middle" font-size="14" fill="#333333">• 希望職種と求人内容の意味的マッチングが欠如</text>
  <text x="450" y="350" text-anchor="middle" font-size="14" fill="#333333">• 過去の応募・勤務履歴が活用されていない（リピート志向無視）</text>
  <text x="450" y="375" text-anchor="middle" font-size="14" fill="#333333">• 実質的な利便性要因が考慮されない（駐車場、交通費など）</text>
  <text x="450" y="400" text-anchor="middle" font-size="14" fill="#333333">• 業務内容の詳細なマッチングが不可能（粗い分類のみ）</text>
</svg>
