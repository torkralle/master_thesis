<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#f0f0f0"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    現行マッチングシステムの構造
  </text>
  
  <!-- Worker Box -->
  <rect x="50" y="150" width="120" height="80" fill="#bbdefb" stroke="#1976d2" stroke-width="2"/>
  <text x="110" y="195" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">ワーカー</text>
  
  <!-- Filter Boxes -->
  <rect x="250" y="100" width="100" height="60" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/>
  <text x="300" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">都道府県</text>
  <text x="300" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">市区町村</text>
  
  <rect x="370" y="100" width="100" height="60" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/>
  <text x="420" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">開始日</text>
  <text x="420" y="145" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">終了日</text>
  
  <rect x="490" y="100" width="100" height="60" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/>
  <text x="540" y="125" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">資格種別</text>
  
  <rect x="250" y="200" width="100" height="60" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/>
  <text x="300" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">給与範囲</text>
  
  <rect x="370" y="200" width="100" height="60" fill="#ffe0b2" stroke="#f57c00" stroke-width="2"/>
  <text x="420" y="235" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">介護種別</text>
  
  <!-- Result Box -->
  <rect x="650" y="150" width="120" height="80" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="710" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">検索結果</text>
  <text x="710" y="205" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#333">リスト</text>
  
  <!-- Arrows -->
  <line x1="170" y1="190" x2="250" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="190" x2="370" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="190" x2="490" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="190" x2="250" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="190" x2="370" y2="230" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <line x1="350" y1="130" x2="650" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="130" x2="650" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="590" y1="130" x2="650" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="230" x2="650" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="230" x2="650" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Problem Box -->
  <rect x="150" y="320" width="500" height="60" fill="#ffcdd2" stroke="#d32f2f" stroke-width="2"/>
  <text x="400" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    問題点: 意味的マッチング欠如、履歴未活用
  </text>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#d32f2f">
    実質利便性無視、業務内容の粗い分類のみ
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  
  <!-- Placeholder text -->
  <text x="400" y="390" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">
    [この画像を差し替えてください]
  </text>
</svg>
