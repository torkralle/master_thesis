<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550">
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666666"/>
    </marker>
  </defs>
  
  <rect width="1000" height="550" fill="#ffffff"/>
  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">ビジネスプランと価値循環（データ駆動の改善サイクル）</text>
  
  <!-- Actors and processes -->
  <rect x="50" y="180" width="200" height="100" fill="#f5f5f5" stroke="#666666" stroke-width="2" rx="6"/>
  <text x="150" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">介護事業者</text>
  <text x="150" y="240" text-anchor="middle" font-size="13" fill="#666666">求人掲載</text>
  <text x="150" y="260" text-anchor="middle" font-size="13" fill="#666666">勤怠承認</text>
  
  <rect x="310" y="80" width="180" height="80" fill="#e0e0e0" stroke="#333333" stroke-width="2" rx="6"/>
  <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">マッチング/推薦</text>
  <text x="400" y="135" text-anchor="middle" font-size="12" fill="#666666">(NLP, 重み付け)</text>
  
  <rect x="310" y="280" width="180" height="80" fill="#e0e0e0" stroke="#333333" stroke-width="2" rx="6"/>
  <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">勤怠打刻/補正</text>
  <text x="400" y="335" text-anchor="middle" font-size="12" fill="#666666">(バッファ, 休憩)</text>
  
  <rect x="550" y="180" width="200" height="100" fill="#f5f5f5" stroke="#666666" stroke-width="2" rx="6"/>
  <text x="650" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">ワーカー</text>
  <text x="650" y="240" text-anchor="middle" font-size="13" fill="#666666">応募</text>
  <text x="650" y="260" text-anchor="middle" font-size="13" fill="#666666">シフト実行</text>
  
  <rect x="800" y="180" width="150" height="100" fill="#d8d8d8" stroke="#333333" stroke-width="2" rx="6"/>
  <text x="875" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">支払い/送金</text>
  <text x="875" y="240" text-anchor="middle" font-size="12" fill="#666666">手数料回収</text>
  
  <!-- Data accumulation -->
  <rect x="350" y="430" width="300" height="80" fill="#e8e8e8" stroke="#666666" stroke-width="2" rx="6"/>
  <text x="500" y="460" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">データ蓄積/学習</text>
  <text x="500" y="485" text-anchor="middle" font-size="12" fill="#666666">応募履歴, 評価, 勤怠実績</text>
  
  <!-- Arrows -->
  <line x1="250" y1="210" x2="305" y2="120" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="270" y="160" font-size="11" fill="#333333">求人データ</text>
  
  <line x1="490" y1="120" x2="545" y2="210" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="510" y="160" font-size="11" fill="#333333">推薦/通知</text>
  
  <line x1="650" y1="280" x2="495" y2="310" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="560" y="300" font-size="11" fill="#333333">応募・出勤</text>
  
  <line x1="490" y1="320" x2="795" y2="250" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="620" y="290" font-size="11" fill="#333333">実績・賃金計算</text>
  
  <line x1="875" y1="180" x2="750" y2="230" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="800" y="200" font-size="11" fill="#333333">報酬+交通費</text>
  
  <line x1="800" y1="230" x2="255" y2="250" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="500" y="235" font-size="11" fill="#333333">手数料, 分析</text>
  
  <line x1="400" y1="280" x2="450" y2="425" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <line x1="400" y1="160" x2="450" y2="425" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  
  <line x1="550" y1="450" x2="405" y2="165" stroke="#666666" stroke-width="2" marker-end="url(#arrow8)"/>
  <text x="460" y="380" font-size="11" fill="#333333">モデル更新</text>
</svg>
