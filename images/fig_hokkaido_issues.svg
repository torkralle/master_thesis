<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <marker id="arrow4" markerWidth="15" markerHeight="15" refX="12" refY="6" orient="auto">
      <polygon points="0 0, 15 6, 0 12" fill="#000000"/>
    </marker>
  </defs>
  
  <rect width="900" height="650" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#000000">北海道における介護人材確保の特殊事情</text>
  
  <rect x="100" y="80" width="700" height="100" fill="#e8e8e8" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="130" y="110" font-size="20" font-weight="bold" fill="#000000">1. 高齢化率の高さ</text>
  <text x="130" y="145" font-size="17" fill="#333333">2025年の高齢化率:</text>
  <text x="350" y="145" font-size="24" font-weight="bold" fill="#000000">33.5%</text>
  <text x="130" y="170" font-size="15" fill="#666666">(全国平均 30% を大幅に超過)</text>
  
  <rect x="100" y="200" width="700" height="100" fill="#d8d8d8" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="130" y="230" font-size="20" font-weight="bold" fill="#000000">2. 極端な人口偏在</text>
  <rect x="150" y="245" width="250" height="40" fill="#888888" stroke="#333333" stroke-width="2" rx="4"/>
  <text x="275" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">札幌圏: 340万人 (65%)</text>
  <rect x="430" y="245" width="250" height="40" fill="#bbb" stroke="#333333" stroke-width="2" rx="4"/>
  <text x="555" y="270" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">地方部: 180万人 (35%)</text>
  
  <rect x="100" y="320" width="700" height="100" fill="#c8c8c8" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="130" y="350" font-size="20" font-weight="bold" fill="#000000">3. 広大な面積と移動距離</text>
  <text x="130" y="380" font-size="17" fill="#333333">市町村間の平均距離:</text>
  <text x="370" y="380" font-size="20" font-weight="bold" fill="#000000">本州の 3〜4倍</text>
  <text x="130" y="408" font-size="15" fill="#666666">冬季（4〜5ヶ月）は積雪・凍結で移動困難</text>
  
  <rect x="100" y="440" width="700" height="100" fill="#b8b8b8" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="130" y="470" font-size="20" font-weight="bold" fill="#000000">4. 公共交通の脆弱性</text>
  <text x="130" y="500" font-size="17" fill="#333333">バス・鉄道の廃止・減便が進行</text>
  <text x="130" y="525" font-size="17" fill="#333333">→ 自家用車がないと通勤困難</text>
  
  <line x1="450" y1="550" x2="450" y2="555" stroke="#000000" stroke-width="4" marker-end="url(#arrow4)"/>
  
  <rect x="150" y="560" width="600" height="70" fill="#e0e0e0" stroke="#333333" stroke-width="4" rx="10"/>
  <rect x="150" y="560" width="600" height="70" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="8,4" rx="10"/>
  <text x="450" y="588" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">結果</text>
  <text x="450" y="615" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">マッチング選択肢の極端な狭小化</text>
</svg>
