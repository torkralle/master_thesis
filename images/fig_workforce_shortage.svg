<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333333"/>
    </marker>
  </defs>
  
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">介護職員数の推移と必要な増員ペース</text>
  
  <rect x="50" y="80" width="200" height="150" fill="#f5f5f5" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="150" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">2022年度</text>
  <text x="150" y="145" text-anchor="middle" font-size="48" font-weight="bold" fill="#000000">215</text>
  <text x="150" y="165" text-anchor="middle" font-size="20" fill="#000000">万人</text>
  <text x="150" y="200" text-anchor="middle" font-size="14" fill="#666666">(現状)</text>
  
  <line x1="250" y1="155" x2="325" y2="155" stroke="#333333" stroke-width="3" marker-end="url(#arrow1)"/>
  <text x="287" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">+25万</text>
  
  <rect x="330" y="80" width="200" height="150" fill="#e0e0e0" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="430" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">2026年度</text>
  <text x="430" y="145" text-anchor="middle" font-size="48" font-weight="bold" fill="#000000">240</text>
  <text x="430" y="165" text-anchor="middle" font-size="20" fill="#000000">万人</text>
  <text x="430" y="190" text-anchor="middle" font-size="14" fill="#666666">必要数</text>
  <text x="430" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">+25万人不足</text>
  
  <line x1="530" y1="155" x2="605" y2="155" stroke="#333333" stroke-width="3" marker-end="url(#arrow1)"/>
  <text x="567" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">+32万</text>
  
  <rect x="610" y="80" width="200" height="150" fill="#cccccc" stroke="#333333" stroke-width="3" rx="8"/>
  <text x="710" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">2040年度</text>
  <text x="710" y="145" text-anchor="middle" font-size="48" font-weight="bold" fill="#000000">272</text>
  <text x="710" y="165" text-anchor="middle" font-size="20" fill="#000000">万人</text>
  <text x="710" y="190" text-anchor="middle" font-size="14" fill="#666666">必要数</text>
  <text x="710" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">+57万人不足</text>
  
  <rect x="100" y="270" width="700" height="100" fill="#f0f0f0" stroke="#666666" stroke-width="2" rx="8"/>
  <text x="450" y="300" text-anchor="middle" font-size="16" font-weight="bold" fill="#000000">増員ペースの比較</text>
  <text x="150" y="330" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">必要な増員ペース:</text>
  <text x="320" y="330" text-anchor="start" font-size="15" fill="#333333">年間 6.3万人</text>
  <text x="150" y="355" text-anchor="start" font-size="15" font-weight="bold" fill="#000000">現在の増員ペース:</text>
  <text x="320" y="355" text-anchor="start" font-size="15" fill="#333333">年間 1.0万人</text>
  <text x="550" y="342" text-anchor="middle" font-size="18" font-weight="bold" fill="#000000">⇒ 約6倍のペースアップが必要</text>
</svg>
