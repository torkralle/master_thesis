<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666666"/>
    </marker>
  </defs>
  
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#000000">介護特化型マッチングアプリの概要</text>
  
  <rect x="50" y="150" width="180" height="120" fill="#f5f5f5" stroke="#333333" stroke-width="2" rx="6"/>
