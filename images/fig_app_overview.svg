  <line x1="270" y1="320" x2="620" y2="280" stroke="#999999" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="430" y1="320" x2="640" y2="280" stroke="#999999" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="590" y1="320" x2="660" y2="280" stroke="#999999" stroke-width="2" stroke-dasharray="5,3"/>
  
