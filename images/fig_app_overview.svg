  <text x="660" y="255" text-anchor="middle" font-size="14" fill="#666666">応募・勤務</text>
  
  <line x1="230" y1="200" x2="305" y2="200" stroke="#666666" stroke-width="3" marker-end="url(#arrow6)"/>
