<svg width="800" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="350" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">
    介護特化型マッチングアプリの概要
  </text>
  
  <!-- Provider Box -->
  <rect x="50" y="120" width="150" height="100" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="125" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">介護事業者</text>
  <text x="125" y="185" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">求人情報登録</text>
  
  <!-- Matching System Box (emphasized) -->
  <rect x="300" y="100" width="180" height="120" fill="#e0e0e0" stroke="#424242" stroke-width="3"/>
  <text x="390" y="140" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">マッチング</text>
  <text x="390" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">システム</text>
  <text x="390" y="195" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">条件解析</text>
  <text x="390" y="212" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">最適化処理</text>
  
  <!-- Worker Box -->
  <rect x="580" y="120" width="150" height="100" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="655" y="155" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">ワーカー</text>
  <text x="655" y="180" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">条件入力</text>
  <text x="655" y="200" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">応募</text>
  
  <!-- Worker Types -->
  <rect x="520" y="270" width="100" height="40" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
  <text x="570" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">潜在介護士</text>
  
  <rect x="630" y="270" width="100" height="40" fill="#fff9c4" stroke="#f57f17" stroke-width="1"/>
  <text x="680" y="295" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">副業希望者</text>
  
  <!-- Arrows -->
  <!-- Provider to System (bidirectional) -->
  <line x1="200" y1="165" x2="300" y2="165" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="175" x2="200" y2="175" stroke="#333" stroke-width="3" marker-end="url(#arrowhead-reverse)"/>
  
  <!-- System to Worker (bidirectional) -->
  <line x1="480" y1="165" x2="580" y2="165" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  <line x1="580" y1="175" x2="480" y2="175" stroke="#333" stroke-width="3" marker-end="url(#arrowhead-reverse)"/>
  
  <!-- Worker types to Worker -->
  <line x1="570" y1="270" x2="625" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead-small)"/>
  <line x1="680" y1="270" x2="675" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead-small)"/>
  
  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
    <marker id="arrowhead-reverse" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <polygon points="10 0, 0 3, 10 6" fill="#333" />
    </marker>
    <marker id="arrowhead-small" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666" />
    </marker>
  </defs>
  
  <!-- Placeholder text -->
  <text x="400" y="335" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#999">
    [この画像を差し替えてください]
  </text>
</svg>
